name: Create Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert README.md to WordPress readme.txt
        uses: everpress-co/action-md2wp@main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build --if-present

      - name: Remove Markdown readme before zip
        run: rm -f README.md

      - name: Read project name
        id: project
        run: echo "name=$(jq -r '.name' package.json)" >> "$GITHUB_OUTPUT"

      - name: Create plugin zip
        run: npm run plugin-zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.project.outputs.name }}.zip
